services:
  - type: web
    name: ims-api
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @ims/api build
    startCommand: pnpm --filter @ims/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ims-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: ims-redis
          property: connectionString
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: COOKIE_NAME
        value: ims_access_token
      - key: COOKIE_MAX_AGE
        value: 900000
    healthCheckPath: /api/health
    disk:
      name: node-modules
      mountPath: /opt/render/project/node_modules

databases:
  - name: ims-db
    databaseName: ims
    plan: free
    region: oregon

  - name: ims-redis
    redisName: ims-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
